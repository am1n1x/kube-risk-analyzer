apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-risk-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-risk-sa-admin-binding
subjects:
  - kind: ServiceAccount
    name: kube-risk-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-risk-analyzer
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kube-risk-analyzer
  template:
    metadata:
      labels:
        app: kube-risk-analyzer
    spec:
      serviceAccountName: kube-risk-sa
      containers:
        - name: analyzer
          image: kube-risk-analyzer:latest  # Локальный образ, который мы загрузим
          imagePullPolicy: IfNotPresent     # Инструктирует K8s брать образ из кэша, а не качать из интернета
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: db-data
              mountPath: /workspace/data
            - name: dumps-data
              mountPath: /workspace/dumps
      volumes:
        - name: db-data
          hostPath:
            path: /var/lib/kube-risk-analyzer/data
            type: DirectoryOrCreate
        - name: dumps-data
          hostPath:
            path: /var/lib/kube-risk-analyzer/dumps
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: kube-risk-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: kube-risk-analyzer
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080  # Порт, на который мы настроим Nginx